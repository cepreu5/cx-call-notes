<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <title>Настройки – модал</title>
    <style>
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
}

.modal-overlay.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.modal-scroll {
  flex: 1;
  overflow-y: auto;
}

.modal-header, .modal-footer {
  padding: 16px;
  background: #f97316;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.color-swatch {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  flex: 0 0 auto; /* да не се разтяга */
}
.color-swatch.selected {
  outline: 2px solid #f97316;
  outline-offset: 2px;
}

    </style>
  </head>

  <body class="flex items-center justify-center min-h-screen bg-[#fafafa]">
<button id="openSettings" class="open-btn">Отвори настройки</button>

<div id="settingsModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <span>Настройки</span>
      <button id="closeSettingsHeader" class="close-btn">X</button>
    </div>

    <div class="modal-scroll">
      <!-- Тук ще бъде целият ти диалог -->
<!-- Палитра -->
<div id="palette" class="flex items-center gap-1.5">
  <div class="color-swatch" data-color="#ef4444" style="background:#ef4444"></div>
  <div class="color-swatch" data-color="#f97316" style="background:#f97316"></div>
  <div class="color-swatch" data-color="#eab308" style="background:#eab308"></div>
  <div class="color-swatch" data-color="#22c55e" style="background:#22c55e"></div>
  <div class="color-swatch" data-color="#14b8a6" style="background:#14b8a6"></div>
  <div class="color-swatch" data-color="#3b82f6" style="background:#3b82f6"></div>
  <div class="color-swatch" data-color="#6366f1" style="background:#6366f1"></div>
  <div class="color-swatch" data-color="#a855f7" style="background:#a855f7"></div>
</div>

<!-- HEX -->
<input id="hexInput" type="text" />

<!-- RGB -->
<input id="rgbR" type="text" />
<input id="rgbG" type="text" />
<input id="rgbB" type="text" />

<!-- Преглед (фонът, който искаш да сменяш) -->
<div id="previewBox">Примерен текст</div>

    </div>

    <div class="modal-footer">
      <button id="closeSettingsFooter">Затвори</button>
      <button id="saveSettings">Запази</button>
    </div>
  </div>
</div>

  </body>

<script>
  const modal = document.getElementById('settingsModal');
  const openBtn = document.getElementById('openSettings');
  const closeHeader = document.getElementById('closeSettingsHeader');
  const closeFooter = document.getElementById('closeSettingsFooter');
  const saveBtn = document.getElementById('saveSettings');

  openBtn.addEventListener('click', () => {
    modal.classList.add('show');
  });

  function closeModal() {
    modal.classList.remove('show');
  }

  closeHeader.addEventListener('click', closeModal);
  closeFooter.addEventListener('click', closeModal);

  saveBtn.addEventListener('click', () => {
    console.log("Запази натиснато");
    closeModal();
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
</script>

<script>
  const palette = document.getElementById('palette');
  const hexInput = document.getElementById('hexInput');
  const rgbR = document.getElementById('rgbR');
  const rgbG = document.getElementById('rgbG');
  const rgbB = document.getElementById('rgbB');
  const previewBox = document.getElementById('previewBox');

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    return {
      r: parseInt(hex.slice(0, 2), 16),
      g: parseInt(hex.slice(2, 4), 16),
      b: parseInt(hex.slice(4, 6), 16),
    };
  }

  function rgbToHex(r, g, b) {
    return (
      '#' +
      [r, g, b]
        .map((x) => {
          const h = Number(x).toString(16);
          return h.length === 1 ? '0' + h : h;
        })
        .join('')
    );
  }

  function applyColor(hex) {
    // маркиране
    document.querySelectorAll('.color-swatch').forEach((sw) =>
      sw.classList.toggle('selected', sw.dataset.color === hex)
    );

    // HEX
    hexInput.value = hex;

    // RGB
    const { r, g, b } = hexToRgb(hex);
    rgbR.value = r;
    rgbG.value = g;
    rgbB.value = b;

    // preview
    previewBox.style.background = hex;
    previewBox.style.color = '#ffffff';
  }

  palette.addEventListener('click', (e) => {
    const sw = e.target.closest('.color-swatch');
    if (!sw) return;
    applyColor(sw.dataset.color);
  });

  // стартов цвят
  applyColor('#f97316');
</script>


</html>
