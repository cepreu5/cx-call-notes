<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <title>Настройки – модал</title>

    <!-- Tailwind от CDN за да работят класовете от Subframe -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f5f5f5;
      }
      /* overlay + центриран модал */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal-card {
        width: 100%;
        max-width: 480px;
        max-height: 90vh;
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .modal-scroll {
        flex: 1;
        overflow-y: auto;
      }
    </style>
  </head>

  <body class="flex items-center justify-center min-h-screen bg-[#fafafa]">
    <!-- Бутон за отваряне на модала -->
    <button
      id="openSettings"
      class="rounded-full bg-[#f97316] px-5 py-2.5 text-sm font-semibold text-white shadow-md hover:bg-[#fb923c]"
    >
      Отвори настройки
    </button>

    <!-- MODAL -->
    <div id="settingsModal" class="modal-overlay">
      <div class="modal-card">
        <!-- sticky header -->
        <div class="flex w-full items-center justify-between px-6 py-5 sticky top-0 z-10 gap-3 bg-gradient-to-r from-[#f97316] to-[#fb923c]">
          <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 flex-none items-center justify-center rounded-full bg-[#ffffff33] text-[18px] text-white">
              <svg
                class="text-[14px] text-[#171717]"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4L17 7a7.6 7.6 0 0 0-1.7-1l-.4-2.5h-4L10.5 6a7.6 7.6 0 0 0-1.7 1L6.4 6l-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4.2l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
              </svg>
            </div>
            <span class="text-[20px] font-bold leading-[28px] text-white">
              Настройки
            </span>
          </div>
          <button
            id="closeSettingsHeader"
            class="flex h-8 w-8 flex-none items-center justify-center rounded-full cursor-pointer text-[18px] text-white hover:bg-[#ffffff33]"
          >
            <svg
              class="text-[14px] text-[#171717]"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path
                d="m6 6 12 12m0-12L6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <!-- scrollable content -->
        <div class="modal-scroll flex w-full flex-col items-stretch font-['Inter'] bg-[#fafafa] px-6 py-6">
          <!-- тук е целият ти Subframe layout, само className -> class и textarea затворено -->

          <div class="flex w-full flex-col items-start gap-3 rounded-2xl bg-white px-5 py-4 shadow-[0px_1px_3px_0px_#0000000f]">
            <span class="w-full text-[11px] font-[600] leading-[16.5px] text-[#a3a3a3] uppercase tracking-[0.06em]">
              Преглед
            </span>
            <div class="flex w-full items-center justify-center rounded-xl px-4 py-6 bg-gradient-to-r from-[#f97316] to-[#fb923c]">
              <span class="grow text-[14px] font-[600] leading-[21px] text-white text-center rounded-full bg-gradient-to-r from-[#f97316] to-[#fb923c] px-4 py-2">
                Примерен текст
              </span>
            </div>
          </div>

          <!-- Цветове -->
          <div class="mt-4 flex w-full flex-col items-start gap-3 rounded-2xl bg-white px-5 py-4 shadow-[0px_1px_3px_0px_#0000000f]">
            <span class="w-full text-[11px] font-[600] leading-[17px] text-[#a3a3a3] uppercase tracking-[0.06em]">
              Цветове
            </span>
            <div class="flex w-full items-center justify-between rounded-xl border border-[#e5e5e5] px-4 py-3 gap-2 hover:border-[#f97316]">
              <div class="flex items-start text-[14px] text-[#737373] cursor-pointer">
                <span class="text-[14px] leading-[20px] text-[#171717]">
                  Основен екран
                </span>
              </div>
            </div>
          </div>

          <!-- Палитра, HEX, RGB, Етикети, Меню бутон, Прозрачност, Архивиране, Настройки -->
          <!-- Поставям целия останал JSX почти 1:1, само className -> class и textarea затворено -->

          <!-- ... тук можеш да поставиш целия останал блок от документа, като смениш className -> class и textarea /> -> </textarea> ... -->
        </div>

        <!-- sticky footer -->
        <div class="flex w-full items-center justify-end gap-3 border-t border-[#ffffff33] px-6 py-4 sticky bottom-0 z-10 bg-gradient-to-r from-[#f97316] to-[#fb923c]">
          <button
            id="closeSettingsFooter"
            class="flex items-center justify-center rounded-full px-5 py-2.5 cursor-pointer text-[14px] font-[600] text-white hover:bg-[#ffffff26]"
          >
            Затвори
          </button>
          <button
            id="saveSettings"
            class="flex items-center justify-center rounded-full bg-white px-6 py-2.5 shadow-[0px_2px_6px_0px_#0000001a] cursor-pointer text-[14px] font-[700] text-[#f97316] hover:bg-[#fff7ed]"
          >
            Запази
          </button>
        </div>
      </div>
    </div>

    <script>
      const modal = document.getElementById('settingsModal');
      const openBtn = document.getElementById('openSettings');
      const closeHeader = document.getElementById('closeSettingsHeader');
      const closeFooter = document.getElementById('closeSettingsFooter');
      const saveBtn = document.getElementById('saveSettings');

      openBtn.addEventListener('click', () => {
        modal.classList.add('show');
      });

      function closeModal() {
        modal.classList.remove('show');
      }

      closeHeader.addEventListener('click', closeModal);
      closeFooter.addEventListener('click', closeModal);

      saveBtn.addEventListener('click', () => {
        // тук можеш да закачиш логика за Запази
        console.log('Запази натиснато');
        closeModal();
      });

      // затваряне при клик извън картата
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
